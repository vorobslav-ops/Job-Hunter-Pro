name: Build Standalone Executables

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pandas requests beautifulsoup4 google-api-python-client google-auth-httplib2 google-auth-oauthlib ollama python-dotenv

    - name: Compile Windows EXE
      if: matrix.os == 'windows-latest'
      run: pyinstaller --onefile --collect-all streamlit --collect-all googleapiclient --hidden-import google_auth_oauthlib --hidden-import ollama --hidden-import dotenv --add-data "app.py;." --name "Job-Hunter-Pro-Windows" run_app.py

    - name: Compile Linux Binary
      if: matrix.os == 'ubuntu-latest'
      run: pyinstaller --onefile --collect-all streamlit --collect-all googleapiclient --hidden-import google_auth_oauthlib --hidden-import ollama --hidden-import dotenv --add-data "app.py:." --name "Job-Hunter-Pro-Linux" run_app.py

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Job-Hunter-Pro-Windows
        path: dist/Job-Hunter-Pro-Windows.exe

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Job-Hunter-Pro-Linux
        path: dist/Job-Hunter-Pro-Linux